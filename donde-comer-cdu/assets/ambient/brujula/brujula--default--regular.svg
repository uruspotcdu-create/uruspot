<?xml version="1.0" encoding="UTF-8"?>
<!--
  URU SPOT — Ambient Engine — Familia: Brújula
  Archivo: brujula, variante default, peso regular.

  Cap. 2.1: "Ancla simbólica única del producto — orientación,
  encontrar tu lugar." Plano P2 (Orientación, Cap. 4.1). Único peso
  permitido: regular (Cap. 1.3 — "brújulas, elementos de plano
  medio" es, textualmente, uno de los tres usos de ese peso).
  Movimiento heredado: Rotación mínima (aro) + oscilación de aguja
  (Cap. 5) — dos ejes de movimiento simultáneos, el máximo que
  permite el capítulo, aplicados afuera de este archivo por
  ambiente-tokens-movimiento.css. Este SVG nunca anima su propio
  grosor (Cap. 1.3).

  Estructura en 3 grupos con significado propio (Cap. 3.3: "en una
  brújula: aro / marcas / aguja... nunca un único path monolítico"):
  brujula-aro, brujula-marcas, brujula-aguja. Cada grupo es el que
  luego anima su propio eje de movimiento por separado.

  Construido con 3 de las 5 primitivas compartidas: círculo
  concéntrico (aro), marca de coordenada (marcas cardinales + punta
  norte de la aguja) y línea recta (cuerpo de la aguja).

  Revisión (post-lanzamiento, feedback visual directo): la aguja
  usaba antes la primitiva sinusoide (curva ondulada) por la
  hipótesis de que un trazo recto se leería como marca de retícula
  en vez de instrumento. En la práctica pasó lo contrario: la curva
  ondulada, sumada a la opacidad baja del plano P2 (Cap. 4.1,
  0.18–0.30) y al resto de capas ambientales superpuestas, hacía que
  el asset entero no se leyera como brújula — solo como líneas
  sueltas. Se volvió a prim-linea (mismo transform, misma longitud)
  porque, en este contexto concreto, prima la legibilidad inmediata
  del símbolo por sobre la distinción teórica de vocabulario de
  formas entre familias.

  Color/opacidad: currentColor + la variable de color del plano P2
  (ver assets/ambient/_tokens/), nunca fijo (Cap. 3.4, 11.2). Grosor:
  variable de trazo regular (Cap. 1.3).

  Revisión 2 (mismo feedback visual directo que la Revisión 1 de
  arriba): con la aguja ya recta, seguía sin distinguirse del resto
  del Ambient Engine — Retícula (P0), Topográficas (P0) y Corrientes
  (P1) comparten la misma zona de pantalla, el mismo gris neutro y
  opacidades del mismo orden (0.08–0.30), así que el ojo no podía
  separar "esto es la Brújula" de "esto es la grilla de fondo". Se
  le da opacidad propia (0.55, fija en este archivo) en vez de
  heredar --amb-p2-opacidad (que se queda en su techo documentado,
  0.30, y la siguen usando Partículas de deriva sin cambios) —
  justificado porque la Brújula es, textualmente, el "ancla simbólica
  única del producto" (Cap. 2.1): la única familia con una razón real
  para pedir más presencia que el resto del sistema, no una excepción
  arbitraria.

  Punta norte de la aguja: se tiñe con --color-granate-clara (el
  acento de marca, no un color nuevo) en vez de heredar currentColor
  — es el único toque de color entre líneas grises, la señal más
  rápida de "acá está la brújula" sin depender de que el usuario mire
  con atención el resto de la geometría.

  Complejidad (Cap. 9.2): 3 grupos (límite 6), 7 nodos <use> (límite
  80 por asset). Sin filter, sin animación de propiedades de layout
  (Cap. 9.1) — solo transform vía las clases de cada grupo.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     class="amb-asset amb-asset--brujula"
     style="color:var(--amb-p2-color);
            opacity:0.55;
            stroke:currentColor; stroke-width:var(--amb-trazo-regular);
            fill:none;" aria-hidden="true" focusable="false">

  <!-- Aro — círculo concéntrico sin escalar (radio 30, el mismo que
       trae la primitiva). Rotación mínima (Cap. 5: "el aro casi no
       rota"): la clase de movimiento se aplica sobre este grupo.

       2026-08-08: geometría copiada inline desde prim-circulo-
       concentrico (assets/ambient/_primitivas/primitivas-
       compartidas.svg) en vez de referenciarla con <use
       href="archivo-externo.svg#id">. Motivo (feedback visual
       directo, mismo criterio que las dos revisiones de más arriba):
       Chrome no resuelve de forma confiable un <use> que apunta a un
       <symbol> de OTRO documento SVG — en la práctica, la mitad de
       las veces el aro y las marcas quedaban invisibles (bbox
       0x0x0x0) mientras el resto del sitio ya había "calentado" el
       recurso externo por otra vía. Es exactamente el problema que
       reportó el feedback: "debería verse una brújula y no se ve".
       Se prioriza que el símbolo SIEMPRE se pinte por sobre la
       reutilización de primitivas vía archivo compartido — el mismo
       criterio de legibilidad inmediata que ya justificó las dos
       revisiones anteriores de este archivo. -->
  <g class="brujula-aro">
    <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Marcas cardinales — 4 marcas de coordenada sobre el propio aro
       (radio 30, mismo radio que el aro para que queden exactamente
       sobre el trazo, no flotando adentro/afuera). Grupo fijo: nunca
       rota ni oscila, es la referencia estática contra la que se
       lee el movimiento del aro y de la aguja. Geometría inline por
       el mismo motivo que brujula-aro (ver nota arriba). -->
  <g class="brujula-marcas" fill="currentColor">
    <g transform="translate(0 -30)">
      <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <circle cx="50" cy="50" r="1.4" fill="currentColor" stroke="none"/>
    </g>
    <g transform="translate(30 0)">
      <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <circle cx="50" cy="50" r="1.4" fill="currentColor" stroke="none"/>
    </g>
    <g transform="translate(0 30)">
      <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <circle cx="50" cy="50" r="1.4" fill="currentColor" stroke="none"/>
    </g>
    <g transform="translate(-30 0)">
      <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <circle cx="50" cy="50" r="1.4" fill="currentColor" stroke="none"/>
    </g>
  </g>

  <!-- Aguja — línea recta (prim-linea, Cap. 3.3) rotada a vertical y
       escalada a 0.7 (semi-longitud 28, apenas adentro del radio del
       aro) + una marca de coordenada en la punta norte, para que se
       distinga de la punta sur al oscilar. Se reemplazó la sinusoide
       original por esta primitiva (mismo transform, misma longitud)
       porque una curva ondulada no se lee como aguja de instrumento a
       primer vistazo — un trazo recto sí, y es justamente lo que Cap.
       1.2 pide ("geometría construida" legible, no ambigua). Todo el
       grupo es lo que anima la oscilación (Cap. 5: "la aguja oscila
       buscando norte"); en reposo (0°) la punta norte queda alineada
       con la marca cardinal N de brujula-marcas. Geometría inline por
       el mismo motivo que brujula-aro (ver nota arriba) — la línea sí
       llegaba a resolver por <use> externo en las pruebas, pero de
       forma inconsistente según qué otro asset la haya "precalentado"
       antes; se inlinea igual para que este archivo no dependa de
       ningún otro para pintarse completo. -->
  <g class="brujula-aguja" fill="currentColor">
    <line x1="10" y1="50" x2="90" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke" transform="translate(50 50) scale(0.7) translate(-50 -50) rotate(90 50 50)"/>
    <g transform="translate(0 -28)" style="color:var(--color-granate-clara, #C97A83);">
      <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <circle cx="50" cy="50" r="1.4" fill="currentColor" stroke="none"/>
    </g>
  </g>

</svg>
