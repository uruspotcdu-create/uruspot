<?xml version="1.0" encoding="UTF-8"?>
<!--
  URU SPOT — Ambient Engine — Primitivas compartidas
  Fase 3, Cap. 3.3: "Ninguna familia inventa su propia geometría desde
  cero — todas ensamblan las mismas 5 primitivas en distinta composición."

  Este archivo NO se renderiza directamente: es una hoja de <symbol>
  para <use xlink:href="primitivas-compartidas.svg#id">. Cada símbolo
  vive en el viewBox canónico 100x100 (Cap. 3.1), centro óptico en
  (50,50), stroke expresado en unidades de viewBox y "currentColor"
  para heredar el token de color del asset que lo instancia (Cap. 3.4
  — nunca color fijo).

  No se define aquí ningún grosor de trazo — cada familia decide su
  peso (hairline/regular/feature, Cap. 1.3) al instanciar el <use>.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <!-- 1. ARCO — arco de circunferencia, 90° por defecto, centrado en (50,50), radio 40.
         Cualquier familia que necesite otro radio/ángulo lo hace con transform
         al instanciar, nunca redefiniendo el path. -->
    <symbol id="prim-arco" viewBox="0 0 100 100">
      <path d="M 90 50 A 40 40 0 0 1 50 90"
            fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>
    </symbol>

    <!-- 2. LINEA — segmento recto de referencia, horizontal, centrado en (50,50).
         Rotación/longitud se ajustan por transform al instanciar (retículas,
         coordenadas), nunca se redibuja el segmento. -->
    <symbol id="prim-linea" viewBox="0 0 100 100">
      <line x1="10" y1="50" x2="90" y2="50"
            stroke="currentColor" vector-effect="non-scaling-stroke"/>
    </symbol>

    <!-- 3. SINUSOIDE — onda regular, un período completo, amplitud 8, eje en y=50.
         Base geométrica de "Corrientes" (deriva direccional) y de la
         oscilación de aguja de "Brújula". -->
    <symbol id="prim-sinusoide" viewBox="0 0 100 100">
      <path d="M 10 50
               C 22.5 34, 37.5 34, 50 50
               C 62.5 66, 77.5 66, 90 50"
            fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>
    </symbol>

    <!-- 4. CIRCULO CONCENTRICO — un solo anillo, centrado en (50,50), radio 30.
         Familias que necesitan varios anillos instancian el símbolo varias
         veces con distinto radio (transform scale), nunca definen un
         segundo círculo dentro del propio símbolo. -->
    <symbol id="prim-circulo-concentrico" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="30"
              fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>
    </symbol>

    <!-- 5. MARCA DE COORDENADA — cruz corta + punto central, usada como
         marcador de posición discreto (familia Coordenadas y, con permiso
         explícito de la Brújula, feedback de selección). -->
    <symbol id="prim-marca-coordenada" viewBox="0 0 100 100">
      <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" vector-effect="non-scaling-stroke"/>
      <circle cx="50" cy="50" r="1.4" fill="currentColor" stroke="none"/>
    </symbol>

  </defs>
</svg>
