<?xml version="1.0" encoding="UTF-8"?>
<!--
  URU SPOT — Ambient Engine — Familia: Halos de posición
  Archivo: halos, variante foco-activo, peso feature.

  Cap. 2.1, familia 7: "el único asset reactivo al usuario — necesario
  para feedback". Plano P3 — Foco (Cap. 4.1: opacidad hasta 60%
  localizado, responde 1:1 al puntero/selección). Único peso feature
  del sistema (Cap. 1.3: "el asset protagonista de una escena
  puntual... nunca más de un asset feature por viewport") — coherente
  con que el propio Cap. 4.2 prohíbe que convivan dos halos activos a
  la vez.

  Construido con UNA sola primitiva compartida (Cap. 3.3):
  circulo-concentrico, instanciada tres veces a distinto radio para
  simular un foco radial suave SIN usar blur (Cap. 9.1: "jamás filter
  como recurso de estilo" — el degradé de intensidad se logra con
  opacidad decreciente entre anillos concéntricos, no con desenfoque).
  Esto es, otra vez, la misma primitiva que usan el aro de la Brújula
  y las motas de Partículas, solo compuesta distinto (Cap. 3.3: "se
  sientan de la misma letra").

  Cap. 13.3 del documento fuente ya audita esta familia y decide
  mantenerla dentro del sistema aunque su disparador sea distinto al
  resto: "geométricamente pertenece al mismo lenguaje... el halo es
  la única familia con permiso de romper la regla P0/P1-no-reacciona
  en sentido inverso — reacciona *solo* al usuario." Por eso este
  asset se ancla al centro óptico (50,50, Cap. 3.1) en reposo, y es
  js/ambiente-halos.js quien lo traslada al punto real de foco.

  Movimiento (Cap. 5: "Iluminación reactiva — crecimiento/atenuación
  ligado 1:1 a la interacción, sin loop propio"): a diferencia de
  TODAS las familias anteriores, este asset no tiene ningún
  @keyframes propio — la transición de aparición/crecimiento vive en
  tokens de movimiento como transition (no animation), disparada por
  la clase .is-visible, mismo mecanismo que ya usa Coordenadas para
  su propia Aparición/desaparición discreta (Cap. 5), con la
  diferencia de que acá también anima transform:scale (crecimiento),
  no solo opacity — es el único asset con licencia para animar scale,
  porque acá el crecimiento ES la semántica del movimiento asignado,
  no un adorno (Cap. 5: "por eso no tiene ciclo autónomo").

  Complejidad (Cap. 9.2): 1 grupo, 3 nodos <use> (límite 80). Sin
  filter, sin animación de propiedades de layout (Cap. 9.1).
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     class="amb-asset amb-asset--halo"
     style="color:var(--amb-p3-color);
            opacity:var(--amb-p3-opacidad);
            stroke:currentColor; stroke-width:var(--amb-trazo-feature);
            fill:none;" aria-hidden="true" focusable="false">

  <!-- Único grupo con significado propio (Cap. 3.3): el foco entero
       se mueve/crece como una sola unidad — a diferencia de Brújula
       (piezas independientes) no hay sub-partes que animen por su
       cuenta, porque la semántica acá es "un punto de atención", no
       un instrumento con partes. -->
  <g class="halo-foco">
    <!-- Anillo exterior — radio completo de la primitiva (30),
         opacidad más baja: el borde tenue del foco. -->
    <use href="../_primitivas/primitivas-compartidas.svg#prim-circulo-concentrico" xlink:href="../_primitivas/primitivas-compartidas.svg#prim-circulo-concentrico" opacity="0.35" transform="scale(1.0)"/>
    <!-- Anillo medio. -->
    <use href="../_primitivas/primitivas-compartidas.svg#prim-circulo-concentrico" xlink:href="../_primitivas/primitivas-compartidas.svg#prim-circulo-concentrico" opacity="0.6" transform="scale(0.62)"/>
    <!-- Núcleo — radio más pequeño, opacidad más alta: el centro
         exacto del punto seleccionado. -->
    <use href="../_primitivas/primitivas-compartidas.svg#prim-circulo-concentrico" xlink:href="../_primitivas/primitivas-compartidas.svg#prim-circulo-concentrico" opacity="1" transform="scale(0.28)"/>
  </g>

</svg>
