<?xml version="1.0" encoding="UTF-8"?>
<!--
  URU SPOT — Ambient Engine — Familia: Coordenadas
  Archivo: coordenadas, variante default, peso hairline.

  Cap. 2.1: "Refuerza la promesa de precisión geográfica real, no
  genérica." Plano P1 (Corriente, junto a Corrientes — Cap. 4.1).
  Único peso permitido: hairline (Cap. 1.3). Movimiento heredado:
  Aparición/desaparición discreta (Cap. 5) — transition de opacity,
  nunca un @keyframes en loop (ver assets/ambient/_tokens/
  ambiente-tokens-movimiento.css). Este SVG nunca anima su propio
  grosor (Cap. 1.3: "jamás se anima su grosor" para hairline).

  Construido enteramente con 1 de las 5 primitivas compartidas
  (Cap. 3.3): marca de coordenada. Un solo marcador, sin repetición
  (Cap. 13.1: "la familia más débil de las 7... la única sin
  movimiento propio real" — acá, deliberadamente, sin campo de
  puntos: es un marcador puntual, no un patrón de fondo).

  Estado inicial oculto: a diferencia de Retícula/Topográficas/
  Corrientes (que fijan su opacidad final directo en el atributo
  style, porque siempre están visibles), acá la opacidad NO se fija
  inline — vive por completo en CSS (la clase base del asset y su
  modificador .is-visible, en ambiente-tokens-movimiento.css, junto
  a la transition de 260ms),
  para que la clase .is-visible que aplica/retira
  js/ambiente-coordenadas.js pueda pisarla. Un opacity inline en
  este mismo <svg> tendría más especificidad que esa clase y la
  transición nunca se vería. Este archivo nunca decide por sí mismo
  cuándo mostrarse.

  Color: currentColor + la variable de color de plano P1 (ver
  assets/ambient/_tokens/), nunca fijo (Cap. 3.4, 11.2). Opacidad
  final y grosor: variables (ver arriba / Cap. 1.3).

  Complejidad (Cap. 9.2): 1 grupo (límite 6), 1 nodo <use> (límite 80
  por asset). Sin filter, sin animación de propiedades de layout
  (Cap. 9.1) — solo opacity vía transition.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     class="amb-asset amb-asset--coordenadas"
     style="color:var(--amb-p1-color);
            stroke:currentColor; stroke-width:var(--amb-trazo-hairline);
            fill:none;" aria-hidden="true" focusable="false">

  <!-- Marcador único — sin repetición (Cap. 2.1, familia 4: "marcas
       + valores tipográficos discretos" — sin el componente
       tipográfico en este paso, ver nota en changelog.md). Se
       posiciona en el centro óptico (50,50, Cap. 3.1); el
       desplazamiento real a la coordenada del punto seleccionado lo
       decide la capa de composición (js/ambiente-coordenadas.js vía
       mostrarEn(x, y)), nunca este archivo. -->
  <g class="coordenadas-marca" opacity="1" fill="currentColor">
    <use href="../_primitivas/primitivas-compartidas.svg#prim-marca-coordenada" xlink:href="../_primitivas/primitivas-compartidas.svg#prim-marca-coordenada"/>
  </g>

</svg>
