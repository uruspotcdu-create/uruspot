name: Tests Visuales

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Correr suite de tests unitarios (motor, contrato, ciclo de vida, coreografías)
        run: node donde-comer-cdu/js/run-tests.js

      - name: Install Playwright Browsers
        # FIX (2026-08-05): el proyecto 'mobile' de playwright.config.js usa
        # devices['iPhone 12'], cuyo defaultBrowserType es 'webkit', no
        # 'chromium'. Instalar solo chromium acá hacía que los 5 tests de
        # 'mobile' fallaran instantáneamente (~12ms, browser executable no
        # encontrado) en TODAS las corridas — nunca fue una diferencia visual
        # real, era un fallo de arranque de navegador enmascarado por el
        # continue-on-error de este mismo workflow. Se instalan ambos.
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
