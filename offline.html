<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sin conexión — URU SPOT</title>
<style>
  :root{
    color-scheme: dark;
    --fondo: #060605;
    --texto: #f4efe6;
    --acento: #e8a030;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    height:100%;
    background:var(--fondo);
    color:var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .envoltorio{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 1.25rem;
    gap:1rem;
  }
  .logo{
    width:64px;
    height:64px;
    border-radius:16px;
    object-fit:cover;
  }
  h1{
    font-size:1.35rem;
    margin:0.25rem 0 0;
  }
  p{
    max-width:32ch;
    line-height:1.5;
    color:#c9c2b4;
    margin:0;
  }
  button{
    margin-top:0.5rem;
    padding:0.75rem 1.5rem;
    border-radius:999px;
    border:1px solid var(--acento);
    background:transparent;
    color:var(--acento);
    font-size:0.95rem;
    cursor:pointer;
  }
  button:active{ transform:scale(0.98); }
</style>
</head>
<body>
  <div class="envoltorio">
    <img class="logo" src="/img/logof.webp" alt="" width="64" height="64">
    <h1>Sin conexión por ahora</h1>
    <p>No pudimos cargar esta página porque no hay internet disponible. Lo que ya visitaste antes sigue disponible sin conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
